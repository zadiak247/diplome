services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: diplome
      MYSQL_USER: diplome
      MYSQL_PASSWORD: diplome_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_USER: diplome
      DB_PASSWORD: diplome_password
      DB_NAME: diplome
      JWT_SECRET: change_me_in_production
      JWT_EXPIRES: 7d
      CORS_ORIGIN: https://pilot-avto-sto.ru,http://95.139.92.186:3000,http://172.25.1.99:3000
      BASE_URL: https://pilot-avto-sto.ru
      UPLOAD_DIR: /app/uploads
      CLIENT_BUILD_DIR: /app/frontend/build
    ports:
      - "5000:5000"
    volumes:
      - backend_uploads:/app/uploads

volumes:
  mysql_data:
  backend_uploads:
